name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every supported NetWasm host builds the packages and runs one shard of the
  # library suites, so consumers are validated where they develop.
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    name: test / ${{ matrix.host }} / shard ${{ matrix.shard }} of 3
    strategy:
      fail-fast: false
      matrix:
        host: [linux-x64, linux-arm64, macos-arm64, windows-x64, windows-arm64]
        shard: [1, 2, 3]
        include:
          - host: linux-x64
            runner: ubuntu-24.04
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: macos-arm64
            runner: macos-14
          - host: windows-x64
            runner: windows-2025
          - host: windows-arm64
            runner: windows-11-vs2026-arm
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and test
        shell: bash
        env:
          NETWASM_TEST_MAX_PARALLELISM: 3
          NETWASM_LIBRARIES_TEST_SHARD: ${{ matrix.shard }}/3
          # The checkout path is deep on Windows runners; keep test outputs short.
          NETWASM_TEST_ARTIFACTS_DIR: ${{ startsWith(matrix.host, 'windows') && format('{0}/t', runner.temp) || '' }}
        run: |
          if [[ "${{ matrix.host }}" == linux-x64 && "${{ matrix.shard }}" == 1 ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s eng/tests -p 'test_*.py'
          fi
          bash eng/test.sh
